name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install openapi-spec-validator==0.7.2
      - run: python -m openapi_spec_validator openapi.yaml
      - run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
  required-ci:
    needs: [contract]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          IS_DRAFT: ${{ github.event.pull_request.draft || false }}
          RESULT: ${{ needs.contract.result }}
        run: |
          test "$IS_DRAFT" = "false"
          test "$RESULT" = "success"
