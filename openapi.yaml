{
  "openapi": "3.1.0",
  "info": {
    "title": "頃合商店 Public API",
    "version": "0.5.0",
    "license": {
      "name": "MIT",
      "identifier": "MIT"
    },
    "description": "開発中の草案。まだ利用開始していません。金額は税込の日本円、数量は1パッケージ単位。商品検索はqを必須とし、重複パラメーター・未定義の入力は拒否します。 CLI向けOAuth Device認可は追加予定で、サービス提供前の契約草案です。 クイック注文は、ホームに1つ設定された商品を商品の指定なしで1パッケージ注文します。設定・変更・解除はアプリとMCPで行い、このAPIからは変更できません。"
  },
  "servers": [
    {
      "url": "https://api.koroai.supply",
      "description": "予定の共通エンドポイント。キーでsandbox/liveを判定。"
    }
  ],
  "security": [
    {
      "apiKey": []
    },
    {
      "deviceToken": []
    }
  ],
  "paths": {
    "/v1/products/search": {
      "get": {
        "operationId": "search_products",
        "summary": "取扱商品を名前で検索",
        "responses": {
          "200": {
            "description": "成功",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "properties": {
                    "data": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/Product"
                      }
                    },
                    "next_cursor": {
                      "type": [
                        "string",
                        "null"
                      ],
                      "format": "uuid"
                    }
                  },
                  "required": [
                    "data",
                    "next_cursor"
                  ]
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Error"
          },
          "403": {
            "$ref": "#/components/responses/Error"
          },
          "404": {
            "$ref": "#/components/responses/Error"
          },
          "409": {
            "$ref": "#/components/responses/Error"
          },
          "413": {
            "$ref": "#/components/responses/Error"
          },
          "415": {
            "$ref": "#/components/responses/Error"
          },
          "422": {
            "$ref": "#/components/responses/Error"
          },
          "429": {
            "$ref": "#/components/responses/Error"
          },
          "502": {
            "$ref": "#/components/responses/Error"
          },
          "503": {
            "$ref": "#/components/responses/Error"
          },
          "504": {
            "$ref": "#/components/responses/Error"
          },
          "401": {
            "description": "OAuthアクセストークンが無効または期限切れ。WWW-Authenticate: Bearer error=\"invalid_token\"。APIキー認証の無効なキーは従来どおり404。",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 200
            },
            "required": true
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "format": "uuid"
            },
            "description": "前の検索応答のnext_cursor。1ページ最大50件。"
          }
        ],
        "description": "qで商品名を部分一致検索します。条件なしの商品一覧は提供しません。",
        "x-required-scope": "products:read"
      }
    },
