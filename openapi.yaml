        "description": "公開client_idはkoroai-cli。CLIは本番用だけを扱う。Web承認画面で契約者がAPI利用を有効にしたホーム、端末名、本番の区分、権限を確認する。画面を開くだけでは認可しない。ホームのAPI利用停止・購入上限解除・契約者交代・端末失効は、その端末のAPI利用を止める。",
