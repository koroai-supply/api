  "components": {
    "securitySchemes": {
      "apiKey": {
        "type": "http",
        "scheme": "bearer",
        "description": "kr_test_ または kr_live_ に43文字のbase64url文字列を続けたキー。発行時だけ全文を表示する。"
      }
    },
    "schemas": {
      "Purchase": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "jan": {
            "type": "string",
            "pattern": "^([0-9]{8}|[0-9]{13})$",
            "description": "チェックディジットが正しいJAN。先頭ゼロを保持する。"
          },
          "qty": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10
          }
        },
        "required": [
          "jan",
          "qty"
        ]
      },
      "ProductRequestInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "jan": {
            "type": "string",
            "pattern": "^([0-9]{8}|[0-9]{13})$",
            "description": "チェックディジットが正しいJAN。先頭ゼロを保持する。"
          }
        },
        "required": [
          "jan"
        ]
      },
      "Product": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "jan": {
            "type": "string",
            "pattern": "^([0-9]{8}|[0-9]{13})$",
            "description": "チェックディジットが正しいJAN。先頭ゼロを保持する。"
          },
          "name": {
            "type": "string"
          },
          "unit_price_jpy": {
            "type": "integer",
            "minimum": 0,
            "description": "日本円、税込。"
          },
          "purchase_unit": {
            "type": "string",
            "const": "package"
          }
        },
        "required": [
