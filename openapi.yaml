        "description": "application/x-www-form-urlencoded。device_code grantではinterval以上待ち、authorization_pendingなら継続、slow_downなら以後の間隔を5秒以上延ばす。通信失敗でもポーリング間隔を増やす。access tokenは予定1時間、refresh tokenは予定90日。refresh_token grantでは更新トークンを毎回回転し、再利用検知でその端末系列を失効する。",
        "servers": [
          {
            "url": "https://koroai.supply",
            "description": "OAuth認可サーバーとログイン済みのWeb承認画面。Stagingでは対応するStagingホストを使う。"
